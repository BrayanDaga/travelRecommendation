<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Bloom | About us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo">
      <a href="/" class="logo-link">
        <img src="logo.png" alt="logo">
        <span>TravelBloom</span>
      </a>
    </div>
    <nav class="menu">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/aboutus.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>

  </header>
  <main>

    <section class="hero">
      <div class="contact">
        <div>
          <h1>CONTAC US</h1>
          <p>Get in touch.</p>
        </div>
        <div>
          <form onsubmit="send(event)" class="my-form">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" placeholder="Enter your name" id="name" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" placeholder="Enter your email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea name="message" id="message" placeholder="Enter your message" class="form-control" required></textarea>
            </div>
            <div class="form-group">
              <button type="submit">Send Message</button>
            </div>


          </form>
        </div>
      </div>
      <div class="social">
        <a href="#"> <i class="fa fa-facebook"></i> </a>
        <a href="#"> <i class="fa fa-twitter"></i> </a>
        <a href="#"> <i class="fa fa-instagram"></i> </a>
        <a href="#"> <i class="fa fa-youtube"></i></a>
      </div>
    </section>
  </main>
  <script>
    function send(e){
      e.preventDefault();
      alert("Gracias por contactarnos")
    }
  </script>
</body>

</html>
